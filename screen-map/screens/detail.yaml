anchor: detail

names: [作品詳細, 詳細画面, 作品の詳細]

summary: 作品の書誌と関係者を出し、本文を読むリンクと青空文庫の図書カードへのリンクを置く

files:
  - AozoraReaderClient/AozoraReaderPackages/Sources/Features/DetailFeature/Sources/DetailView.swift
  - AozoraReaderClient/AozoraReaderPackages/Sources/Features/DetailFeature/Sources/DetailViewModel.swift

ready:
  any: [detail.card_link, detail.error.reload_button]

elements:
  - id: detail.read_button
    name: 読む（リンクのセクション）
    when: 本文の HTML を持つ作品のとき
    actions:
      - tap:
        summary: 本文をリーダーで開く
        expect: {screen: reader, via: push}

  - id: detail.card_link
    name: 図書カードを開く（リンクのセクション）
    actions:
      - tap:
        summary: 青空文庫の図書カードを Safari で開く
        expect: {external: safari}

  - id: BackButton
    name: 戻る（左上）
    actions:
      - tap:
        summary: 前の画面に戻る
        expect: {screen: back, via: back}

  - id: detail.error.reload_button
    name: 再読み込み（画面中央）
    when: 取得に失敗したとき
    actions:
      - tap:
        summary: 作品を取り直す。成功すると詳細が出る
        expect: {visible: detail.card_link}
